
name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
      
      # push changes to GitHub
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Build'
